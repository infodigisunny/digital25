<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Statue of Liberty -->

<!-- Crown rays (7 points) -->
<polygon points="50,4 51.5,12 53,4" fill="#C5FF55"/>
<polygon points="57,6 56,13 59,7" fill="#C5FF55"/>
<polygon points="63,11 59,17 65,13" fill="#C5FF55"/>
<polygon points="43,6 44,13 41,7" fill="#C5FF55"/>
<polygon points="37,11 41,17 35,13" fill="#C5FF55"/>
<polygon points="53,4 54,12 56,5" fill="#C5FF55"/>
<polygon points="47,4 46,12 44,5" fill="#C5FF55"/>

<!-- Head -->
<ellipse cx="50" cy="22" rx="9" ry="10" fill="#C5FF55"/>

<!-- Crown band -->
<rect x="41" y="27" width="18" height="4" rx="1" fill="#C5FF55"/>

<!-- Neck -->
<rect x="46" y="30" width="8" height="5" fill="#C5FF55"/>

<!-- Torch arm (raised right) -->
<path d="M57 34 L57 32 L72 18 L74 20 L60 35Z" fill="#C5FF55"/>

<!-- Torch handle -->
<rect x="71" y="8" width="5" height="13" rx="1.5" fill="#C5FF55"/>

<!-- Torch flame -->
<path d="M69 8 Q73.5 0 78 8Z" fill="#C5FF55"/>
<path d="M71 8 Q73.5 2 76 8Z" fill="#C5FF55" fill-opacity="0.6"/>

<!-- Torch base ring -->
<rect x="69" y="19" width="10" height="3" rx="1" fill="#C5FF55"/>

<!-- Robe body -->
<path d="M38 35 L35 76 L65 76 L62 35Z" fill="#C5FF55"/>

<!-- Left arm holding tablet -->
<path d="M38 38 L38 44 L27 48 L26 44 L37 41Z" fill="#C5FF55"/>

<!-- Tablet -->
<rect x="21" y="43" width="8" height="12" rx="1" fill="#C5FF55"/>
<!-- Roman numerals hint on tablet -->
<rect x="23" y="46" width="1.5" height="6" fill="#C5FF55" fill-opacity="0.4"/>
<rect x="26" y="46" width="1.5" height="6" fill="#C5FF55" fill-opacity="0.4"/>

<!-- Robe folds / vertical lines -->
<rect x="43" y="37" width="1.5" height="38" rx="0.5" fill="#C5FF55" fill-opacity="0.35"/>
<rect x="49" y="35" width="1.5" height="40" rx="0.5" fill="#C5FF55" fill-opacity="0.35"/>
<rect x="55" y="37" width="1.5" height="38" rx="0.5" fill="#C5FF55" fill-opacity="0.35"/>

<!-- Pedestal top -->
<rect x="32" y="76" width="36" height="6" rx="0.5" fill="#C5FF55"/>

<!-- Pedestal middle -->
<rect x="28" y="82" width="44" height="7" rx="0.5" fill="#C5FF55"/>

<!-- Star fort base -->
<rect x="24" y="89" width="52" height="6" rx="0.5" fill="#C5FF55"/>

<!-- Ground -->
<rect x="16" y="95" width="68" height="5" rx="2" fill="#C5FF55"/>
</svg>
