<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Matterhorn - clean sharp mountain peak -->

<!-- Main peak -->
<polygon points="50,2 74,62 26,62" fill="#C5FF55"/>

<!-- Snow cap (lighter, slightly offset) -->
<polygon points="50,2 58,24 42,24" fill="#C5FF55" fill-opacity="0.55"/>

<!-- Left face darker plane -->
<polygon points="50,2 26,62 50,50" fill="black" fill-opacity="0.12"/>

<!-- Left shoulder hill -->
<polygon points="4,76 26,40 46,76" fill="#C5FF55"/>
<!-- Left hill shadow -->
<polygon points="4,76 26,40 26,76" fill="black" fill-opacity="0.1"/>

<!-- Right shoulder hill -->
<polygon points="54,76 74,40 96,76" fill="#C5FF55"/>
<!-- Right hill shadow -->
<polygon points="74,40 74,76 96,76" fill="black" fill-opacity="0.1"/>

<!-- Connecting mountain base -->
<polygon points="2,76 98,76 100,88 0,88" fill="#C5FF55"/>

<!-- Ground base band -->
<rect x="0" y="88" width="100" height="8" rx="2" fill="#C5FF55"/>

<!-- Snow line detail on main peak -->
<path d="M42 24 Q50 20 58 24 Q54 28 50 27 Q46 28 42 24Z" fill="#C5FF55" fill-opacity="0.7"/>

<!-- Cross on summit (Swiss symbol) -->
<rect x="48.5" y="6" width="3" height="10" rx="1" fill="black" fill-opacity="0.18"/>
<rect x="45" y="9.5" width="10" height="3" rx="1" fill="black" fill-opacity="0.18"/>
</svg>
