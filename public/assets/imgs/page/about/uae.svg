<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Burj Khalifa - stepped tiered skyscraper -->

<!-- Spire needle -->
<rect x="49" y="0" width="2" height="16" rx="1" fill="#C5FF55"/>

<!-- Tier 1 - very narrow top -->
<path d="M46 16 L54 16 L53 28 L47 28Z" fill="#C5FF55"/>

<!-- Setback ring 1 -->
<rect x="44" y="28" width="12" height="3" rx="0.5" fill="#C5FF55"/>

<!-- Tier 2 -->
<path d="M44 31 L56 31 L55 44 L45 44Z" fill="#C5FF55"/>

<!-- Setback ring 2 -->
<rect x="41" y="44" width="18" height="3" rx="0.5" fill="#C5FF55"/>

<!-- Tier 3 -->
<path d="M41 47 L59 47 L58 60 L42 60Z" fill="#C5FF55"/>

<!-- Setback ring 3 -->
<rect x="37" y="60" width="26" height="3" rx="0.5" fill="#C5FF55"/>

<!-- Tier 4 - wider lower section -->
<path d="M37 63 L63 63 L62 76 L38 76Z" fill="#C5FF55"/>

<!-- Setback ring 4 -->
<rect x="32" y="76" width="36" height="3" rx="0.5" fill="#C5FF55"/>

<!-- Tier 5 - base section -->
<path d="M32 79 L68 79 L70 90 L30 90Z" fill="#C5FF55"/>

<!-- Podium -->
<rect x="26" y="90" width="48" height="5" rx="0.5" fill="#C5FF55"/>

<!-- Ground -->
<rect x="18" y="95" width="64" height="5" rx="1.5" fill="#C5FF55"/>

<!-- Horizontal floor lines for detail -->
<rect x="47" y="19" width="6" height="1" fill="#C5FF55" fill-opacity="0.45"/>
<rect x="46.5" y="22" width="7" height="1" fill="#C5FF55" fill-opacity="0.45"/>
<rect x="46" y="25" width="8" height="1" fill="#C5FF55" fill-opacity="0.45"/>
<rect x="44.5" y="33.5" width="11" height="1" fill="#C5FF55" fill-opacity="0.45"/>
<rect x="44" y="37" width="12" height="1" fill="#C5FF55" fill-opacity="0.45"/>
<rect x="43.5" y="40.5" width="13" height="1" fill="#C5FF55" fill-opacity="0.45"/>
<rect x="41.5" y="49.5" width="17" height="1" fill="#C5FF55" fill-opacity="0.45"/>
<rect x="41" y="53" width="18" height="1" fill="#C5FF55" fill-opacity="0.45"/>
<rect x="40.5" y="56.5" width="19" height="1" fill="#C5FF55" fill-opacity="0.45"/>
</svg>
