<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Sydney Opera House - clean geometric shells -->

<!-- Shell 1 - far left small -->
<path d="M5 68 Q5 52 16 50 Q13 58 12 68Z" fill="#C5FF55"/>
<path d="M12 68 Q12 55 16 52 Q15 59 15 68Z" fill="#C5FF55" fill-opacity="0.55"/>

<!-- Shell 2 - left large -->
<path d="M14 68 Q15 40 28 36 Q41 40 42 68Z" fill="#C5FF55"/>
<path d="M20 68 Q21 44 28 40 Q35 44 36 68Z" fill="#C5FF55" fill-opacity="0.55"/>

<!-- Shell 3 - right large (tallest) -->
<path d="M44 68 Q46 30 58 26 Q70 30 72 68Z" fill="#C5FF55"/>
<path d="M50 68 Q52 35 58 31 Q64 35 66 68Z" fill="#C5FF55" fill-opacity="0.55"/>

<!-- Shell 4 - right small -->
<path d="M74 68 Q75 50 82 47 Q88 50 90 68Z" fill="#C5FF55"/>
<path d="M81 68 Q81 53 82 50 Q85 53 86 68Z" fill="#C5FF55" fill-opacity="0.55"/>

<!-- Main podium platform -->
<rect x="2" y="68" width="96" height="8" rx="1" fill="#C5FF55"/>

<!-- Podium step -->
<rect x="5" y="76" width="90" height="5" rx="1" fill="#C5FF55"/>

<!-- Forecourt steps -->
<rect x="10" y="81" width="80" height="4" rx="0.5" fill="#C5FF55"/>
<rect x="18" y="85" width="64" height="4" rx="0.5" fill="#C5FF55"/>
<rect x="28" y="89" width="44" height="4" rx="0.5" fill="#C5FF55"/>

<!-- Water line -->
<rect x="0" y="94" width="100" height="3" rx="1" fill="#C5FF55" fill-opacity="0.5"/>
<rect x="0" y="97" width="100" height="2" rx="1" fill="#C5FF55" fill-opacity="0.3"/>
</svg>
