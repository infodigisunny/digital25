<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Auckland Sky Tower -->

<!-- Top antenna tip -->
<rect x="49" y="0" width="2" height="12" rx="1" fill="#C5FF55"/>

<!-- Upper mast -->
<rect x="48" y="12" width="4" height="18" fill="#C5FF55"/>

<!-- Top observation deck (small) -->
<rect x="41" y="28" width="18" height="6" rx="3" fill="#C5FF55"/>
<!-- Top deck glass ring -->
<rect x="43" y="30" width="14" height="2.5" rx="1" fill="black" fill-opacity="0.15"/>

<!-- Upper shaft -->
<rect x="48" y="34" width="4" height="16" fill="#C5FF55"/>

<!-- Main observation pod (large saucer) -->
<rect x="32" y="48" width="36" height="10" rx="5" fill="#C5FF55"/>
<!-- Pod windows ring -->
<rect x="34" y="51" width="32" height="4" rx="2" fill="black" fill-opacity="0.15"/>

<!-- Sky jump platform ring -->
<rect x="28" y="57" width="44" height="3" rx="1.5" fill="#C5FF55"/>

<!-- Lower shaft -->
<path d="M48 58 L52 58 L55 80 L45 80Z" fill="#C5FF55"/>

<!-- Tripod base legs (3 angled legs) -->
<!-- Left leg -->
<path d="M45 76 L40 76 L22 100 L32 100 L47 80Z" fill="#C5FF55"/>
<!-- Right leg -->
<path d="M55 76 L60 76 L78 100 L68 100 L53 80Z" fill="#C5FF55"/>
<!-- Center leg -->
<rect x="47" y="80" width="6" height="20" fill="#C5FF55"/>

<!-- Base ring -->
<ellipse cx="50" cy="100" rx="30" ry="3" fill="#C5FF55"/>
</svg>
